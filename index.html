<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="一个暗黑漫画风格的每日习惯打卡页面，帮助你盯紧今天的目标。"
    />
    <meta name="theme-color" content="#07080d" />
    <title>我是熊凯｜习惯打卡</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="noise-layer" aria-hidden="true"></div>
    <div class="ambient ambient--red" aria-hidden="true"></div>
    <div class="ambient ambient--blue" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="page-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 44 26">
              <path d="M2 13S10 3 22 3s20 10 20 10-8 10-20 10S2 13 2 13Z" />
              <circle cx="22" cy="13" r="5.5" />
              <path d="m17.8 17.2 8.4-8.4" />
            </svg>
          </span>
          <span class="brand-copy">
            <strong>习惯打卡</strong>
            <small>HABIT // DISCIPLINE</small>
          </span>
        </div>
        <div class="date-block">
          <span class="date-label">TODAY</span>
          <p class="today" id="todayLabel"></p>
        </div>
      </header>

      <section class="hero" aria-labelledby="pageTitle">
        <div class="hero-copy">
          <p class="eyebrow">
            <span class="eyebrow-line" aria-hidden="true"></span>
            DAILY ROUTINE / 001
          </p>
          <h1 id="pageTitle">我是<br /><span>熊凯。</span></h1>
          <p class="intro-copy">别和昨天讲和。完成一个，就勾掉一个。</p>
          <div class="hero-note">
            <span class="hero-slash" aria-hidden="true"></span>
            <span>EYES ON THE GOAL</span>
            <span class="hero-note-cn">目光锁定，不退半步</span>
          </div>
        </div>

        <figure class="manga-frame">
          <div
            class="manga-art"
            role="img"
            aria-label="暗黑漫画风格的红瞳少女插画"
          ></div>
          <span class="frame-code">ARCHIVE // 07</span>
          <span class="frame-cross" aria-hidden="true">×</span>
          <figcaption>
            <span>NO MERCY</span>
            <span>对懒惰，零容忍</span>
          </figcaption>
        </figure>
      </section>

      <section class="progress-card" aria-labelledby="progressTitle">
        <div class="progress-heading">
          <div>
            <p class="progress-label" id="progressTitle">
              <span>01</span> TODAY'S PROGRESS
            </p>
            <p class="progress-copy" id="progressCopy">写下今天要击败的目标</p>
          </div>
          <p class="progress-count" aria-live="polite">
            <strong id="completedCount">0</strong>
            <span class="count-divider">/</span>
            <span id="totalCount">0</span>
          </p>
        </div>
        <div
          class="progress-track"
          role="progressbar"
          aria-label="今日习惯完成进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          id="progressBar"
        >
          <span class="progress-fill" id="progressFill"></span>
        </div>
      </section>

      <section class="habit-section" aria-labelledby="habitTitle">
        <form class="habit-form" id="habitForm" novalidate>
          <label class="visually-hidden" for="habitInput">新习惯名称</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            <input
              id="habitInput"
              name="habit"
              type="text"
              maxlength="40"
              autocomplete="off"
              placeholder="添加一个新习惯，例如：散步 20 分钟"
            />
          </div>
          <button class="add-button" type="submit">
            添加
            <span aria-hidden="true">↗</span>
          </button>
        </form>
        <p class="form-message" id="formMessage" role="alert"></p>

        <div class="list-heading">
          <div>
            <span class="section-index">02</span>
            <h2 id="habitTitle">今日习惯</h2>
          </div>
          <span class="habit-total" id="habitTotal">0 项</span>
        </div>

        <ul class="habit-list" id="habitList"></ul>

        <div class="empty-state" id="emptyState">
          <span class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M16 5v22M5 16h22" />
            </svg>
          </span>
          <h2>还没有作战目标</h2>
          <p>在上方写下今天想坚持的习惯。第一刀，从此刻开始。</p>
        </div>
      </section>

      <footer class="page-footer">
        <span class="footer-mark" aria-hidden="true">+</span>
        <span>LOCAL DATA ONLY</span>
        <span class="footer-divider" aria-hidden="true"></span>
        <span>记录仅保存在当前浏览器</span>
      </footer>
    </main>

    <template id="habitTemplate">
      <li class="habit-item">
        <label class="habit-check-row">
          <input class="habit-checkbox" type="checkbox" />
          <span class="custom-checkbox" aria-hidden="true">
            <svg viewBox="0 0 16 16">
              <path d="m3.2 8.2 3.1 3.1 6.5-6.6" />
            </svg>
          </span>
          <span class="habit-title"></span>
        </label>
        <button class="delete-button" type="button">
          <span class="visually-hidden"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5" />
          </svg>
        </button>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
